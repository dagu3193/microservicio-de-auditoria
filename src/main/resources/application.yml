server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: audit-service

  # ===== THREADS (Java 21 Virtual Threads) =====
  threads:
    virtual:
      enabled: true

  # ===== DATABASE =====
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:audit_db}
    username: ${DB_USER:audit_user}
    password: ${DB_PASSWORD:audit_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 50

  # ===== FLYWAY =====
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ===== RABBITMQ =====
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000ms
          max-attempts: 3
          max-interval: 10000ms
          multiplier: 2.0
        acknowledge-mode: auto
        concurrency: 3
        max-concurrency: 10

# ===== ACTUATOR =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# ===== OPENAPI / SWAGGER =====
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false

# ===== APPLICATION CONFIG =====
app:
  rabbitmq:
    exchange: price-quota.exchange
    queue:
      price-quota-audit: audit.price-quota.queue
    routing-key:
      price-changed: price.changed
      quota-changed: quota.changed

logging:
  level:
    com.ecommerce.audit: DEBUG
    org.hibernate.SQL: WARN
    org.springframework.amqp: INFO
