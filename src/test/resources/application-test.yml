spring:
  datasource:
    url: jdbc:h2:mem:audit_db_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  # Deshabilitar auto-arranque de RabbitMQ en pruebas unitarias si no hay Testcontainers
  rabbitmq:
    listener:
      simple:
        auto-startup: false
